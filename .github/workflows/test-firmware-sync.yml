name: Test Firmware Sync

on:
  pull_request:
    paths:
      - ".github/scripts/has-qidi-max4-sync-changes.sh"
      - ".github/scripts/sync-qidi-max4-configs.sh"
      - ".github/workflows/check-qidi-max4-firmware.yml"
      - ".github/workflows/test-firmware-sync.yml"
      - "tests/test-sync-qidi-max4-configs.sh"
  push:
    branches:
      - main
    paths:
      - ".github/scripts/has-qidi-max4-sync-changes.sh"
      - ".github/scripts/sync-qidi-max4-configs.sh"
      - ".github/workflows/check-qidi-max4-firmware.yml"
      - ".github/workflows/test-firmware-sync.yml"
      - "tests/test-sync-qidi-max4-configs.sh"
  workflow_dispatch:

jobs:
  test-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Run synthetic firmware sync tests
        run: bash tests/test-sync-qidi-max4-configs.sh
