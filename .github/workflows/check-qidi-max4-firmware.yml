name: Check QIDI Max 4 Firmware

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      current_version:
        description: "Override firmware endpoint comparison version"
        required: false
        type: string
      download_package:
        description: "Force package download when the endpoint reports an update"
        required: false
        default: false
        type: boolean
      publish_release:
        description: "Force package sync and release when the endpoint reports an update"
        required: false
        default: false
        type: boolean

concurrency:
  group: qidi-max4-firmware-sync
  cancel-in-progress: false

jobs:
  check-firmware:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      need_update: ${{ steps.parse.outputs.need_update }}
      current_version: ${{ steps.current_version.outputs.current_version }}
      version: ${{ steps.parse.outputs.version }}
      url: ${{ steps.parse.outputs.url }}
      description: ${{ steps.parse.outputs.description }}
      apk_size: ${{ steps.parse.outputs.apk_size }}
      is_force: ${{ steps.parse.outputs.is_force }}
      package_filename: ${{ steps.parse.outputs.package_filename }}
      package_candidate_changed: ${{ steps.parse.outputs.package_candidate_changed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Load firmware check settings
        id: settings
        run: |
          SETTINGS_FILE=".github/qidi_max4_firmware_check.json"
          DEFAULT_CURRENT_VERSION=$(jq -r '.current_version' "$SETTINGS_FILE")
          HARDWARE=$(jq -r '.hardware' "$SETTINGS_FILE")
          DEVICE_TYPE=$(jq -r '.device_type' "$SETTINGS_FILE")
          REGION=$(jq -r '.region' "$SETTINGS_FILE")
          VERSION_HEADER=$(jq -r '.version_header' "$SETTINGS_FILE")
          ACCEPT_LANGUAGE=$(jq -r '.accept_language' "$SETTINGS_FILE")
          TIMEZONE=$(jq -r '.timezone' "$SETTINGS_FILE")
          PLATFORM=$(jq -r '.platform' "$SETTINGS_FILE")
          USER_AGENT=$(jq -r '.user_agent' "$SETTINGS_FILE")

          echo "default_current_version=$DEFAULT_CURRENT_VERSION" >> "$GITHUB_OUTPUT"
          echo "hardware=$HARDWARE" >> "$GITHUB_OUTPUT"
          echo "device_type=$DEVICE_TYPE" >> "$GITHUB_OUTPUT"
          echo "region=$REGION" >> "$GITHUB_OUTPUT"
          echo "version_header=$VERSION_HEADER" >> "$GITHUB_OUTPUT"
          echo "accept_language=$ACCEPT_LANGUAGE" >> "$GITHUB_OUTPUT"
          echo "timezone=$TIMEZONE" >> "$GITHUB_OUTPUT"
          echo "platform=$PLATFORM" >> "$GITHUB_OUTPUT"
          echo "user_agent=$USER_AGENT" >> "$GITHUB_OUTPUT"

      - name: Resolve firmware endpoint comparison version
        id: current_version
        env:
          DEFAULT_CURRENT_VERSION: ${{ steps.settings.outputs.default_current_version }}
          INPUT_CURRENT_VERSION: ${{ inputs.current_version }}
        run: |
          CURRENT_VERSION=${INPUT_CURRENT_VERSION:-$DEFAULT_CURRENT_VERSION}
          if [ -z "$CURRENT_VERSION" ]; then
            echo "Unable to determine firmware endpoint comparison version" >&2
            exit 1
          fi

          echo "current_version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Query firmware endpoint
        id: query
        env:
          QIDI_MAX4_DEVICE_ID_SECRET: ${{ secrets.QIDI_MAX4_DEVICE_ID }}
        run: |
          if [ -z "$QIDI_MAX4_DEVICE_ID_SECRET" ]; then
            echo "Missing secret QIDI_MAX4_DEVICE_ID" >&2
            exit 1
          fi

          echo "::add-mask::$QIDI_MAX4_DEVICE_ID_SECRET"
          QIDI_MAX4_DEVICE_ID=$(printf '%s' "$QIDI_MAX4_DEVICE_ID_SECRET" | tr '[:lower:]' '[:upper:]')
          unset QIDI_MAX4_DEVICE_ID_SECRET
          echo "::add-mask::$QIDI_MAX4_DEVICE_ID"

          # Mirror the embedded client's non-empty HMAC signature generation.
          QIDI_MAX4_SIGNATURE=$(printf '%s' 'qidi3d null' | openssl dgst -sha256 -hmac 'qid3d-from-2025-CAFE-BABE' -binary | od -An -tx1 | tr -d ' \n')

          if [ -z "$QIDI_MAX4_SIGNATURE" ]; then
            echo "Failed to generate X-Signature" >&2
            exit 1
          fi

          echo "::add-mask::$QIDI_MAX4_SIGNATURE"

          TS=$(($(date +%s%N)/1000000))
          NONCE=$(openssl rand -hex 16)
          API_URL="https://api.qidimaker.com/backend/v1/fireware/upgrade-info"

          set +e
          HTTP_STATUS=$(curl -sS --get "$API_URL" \
            --retry 4 \
            --retry-all-errors \
            --retry-delay 15 \
            --connect-timeout 15 \
            --max-time 90 \
            --write-out '%{http_code}' \
            --output qidi-max4-update-response.json \
            --data-urlencode "hardware=${{ steps.settings.outputs.hardware }}" \
            --data-urlencode "currentVersion=${{ steps.current_version.outputs.current_version }}" \
            --data-urlencode "deviceId=${QIDI_MAX4_DEVICE_ID}" \
            -H "User-Agent: ${{ steps.settings.outputs.user_agent }}" \
            -H "Accept: */*" \
            -H "Accept-Language: ${{ steps.settings.outputs.accept_language }}" \
            -H "Content-Type: application/json" \
            -H "X-DeviceId: ${QIDI_MAX4_DEVICE_ID}" \
            -H "X-DeviceType: ${{ steps.settings.outputs.device_type }}" \
            -H "X-Nonce: ${NONCE}" \
            -H "X-Platform: ${{ steps.settings.outputs.platform }}" \
            -H "X-Region: ${{ steps.settings.outputs.region }}" \
            -H "X-Signature: ${QIDI_MAX4_SIGNATURE}" \
            -H "X-Timestamp: ${TS}" \
            -H "X-Timezone: ${{ steps.settings.outputs.timezone }}" \
            -H "X-Version: ${{ steps.settings.outputs.version_header }}")
          CURL_STATUS=$?
          set -e

          if [ ! -f qidi-max4-update-response.json ]; then
            : > qidi-max4-update-response.json
          fi

          QIDI_MAX4_DEVICE_ID="$QIDI_MAX4_DEVICE_ID" QIDI_MAX4_SIGNATURE="$QIDI_MAX4_SIGNATURE" \
            perl -0pe 's/\Q$ENV{QIDI_MAX4_DEVICE_ID}\E/[REDACTED_DEVICE_ID]/g; s/\Q$ENV{QIDI_MAX4_SIGNATURE}\E/[REDACTED_SIGNATURE]/g' \
            qidi-max4-update-response.json > qidi-max4-update-response.sanitized.json

          unset QIDI_MAX4_DEVICE_ID
          unset QIDI_MAX4_SIGNATURE

          echo "http_status=$HTTP_STATUS" >> "$GITHUB_OUTPUT"
          echo "curl_status=$CURL_STATUS" >> "$GITHUB_OUTPUT"

      - name: Parse response
        id: parse
        env:
          CURL_STATUS: ${{ steps.query.outputs.curl_status }}
          HTTP_STATUS: ${{ steps.query.outputs.http_status }}
        run: |
          skip_transient() {
            local reason="$1"
            echo "::warning::$reason"
            echo "need_update=false" >> "$GITHUB_OUTPUT"
            echo "package_candidate_changed=false" >> "$GITHUB_OUTPUT"
            {
              echo "## QIDI Max 4 Firmware Check"
              echo ""
              printf -- '- Current version: `%s`\n' "${{ steps.current_version.outputs.current_version }}"
              echo "- Result: transient endpoint failure, skipped this scheduled check"
              printf -- '- HTTP status: `%s`\n' "${HTTP_STATUS:-unknown}"
              printf -- '- curl status: `%s`\n' "${CURL_STATUS:-unknown}"
              echo "- Reason: $reason"
            } >> "$GITHUB_STEP_SUMMARY"
          }

          if [ "${CURL_STATUS:-0}" != "0" ]; then
            skip_transient "curl failed while querying QIDI firmware endpoint"
            exit 0
          fi

          case "${HTTP_STATUS:-000}" in
            408|429|5??|000)
              skip_transient "QIDI firmware endpoint returned transient HTTP status ${HTTP_STATUS:-unknown}"
              exit 0
              ;;
          esac

          if ! jq -e . qidi-max4-update-response.json > /dev/null; then
            echo "Firmware endpoint response was not valid JSON" >&2
            exit 1
          fi

          CODE=$(jq -r '.code // empty' qidi-max4-update-response.json)
          MESSAGE=$(jq -r '.message // empty' qidi-max4-update-response.json)
          if [ "$CODE" != "200" ]; then
            echo "Unexpected API response code: ${CODE:-unknown}" >&2
            if [ -n "$MESSAGE" ]; then
              echo "API message: $MESSAGE" >&2
            fi
            exit 1
          fi

          if ! jq -e '(.data | type == "object") and (.data.needUpdate | type == "boolean")' qidi-max4-update-response.json > /dev/null; then
            echo "Firmware endpoint JSON did not match expected schema" >&2
            exit 1
          fi

          NEED_UPDATE=$(jq -r '.data.needUpdate' qidi-max4-update-response.json)
          VERSION=$(jq -r '.data.version // empty' qidi-max4-update-response.json)
          URL=$(jq -r '.data.url // empty' qidi-max4-update-response.json)
          DESCRIPTION=$(jq -r '.data.description // empty' qidi-max4-update-response.json)
          APK_SIZE=$(jq -r '.data.apkSize // empty' qidi-max4-update-response.json)
          IS_FORCE=$(jq -r '.data.isForce // empty' qidi-max4-update-response.json)

          if [ "$NEED_UPDATE" = "true" ] && { [ -z "$VERSION" ] || [ -z "$URL" ]; }; then
            echo "Firmware endpoint reported an update without required version/url fields" >&2
            exit 1
          fi

          PACKAGE_FILENAME=""
          PACKAGE_CANDIDATE_CHANGED=false
          if [ "$NEED_UPDATE" = "true" ]; then
            PACKAGE_FILENAME=$(basename "${URL%%\?*}")
            TRACKED_PACKAGE_FILENAME=$(jq -r '.firmware_archive.filename // empty' firmware-package.json 2>/dev/null || true)
            if [ "$PACKAGE_FILENAME" != "$TRACKED_PACKAGE_FILENAME" ]; then
              PACKAGE_CANDIDATE_CHANGED=true
            fi
          fi

          echo "need_update=$NEED_UPDATE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "apk_size=$APK_SIZE" >> "$GITHUB_OUTPUT"
          echo "is_force=$IS_FORCE" >> "$GITHUB_OUTPUT"
          echo "package_filename=$PACKAGE_FILENAME" >> "$GITHUB_OUTPUT"
          echo "package_candidate_changed=$PACKAGE_CANDIDATE_CHANGED" >> "$GITHUB_OUTPUT"
          {
            echo "description<<EOF"
            echo "$DESCRIPTION"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## QIDI Max 4 Firmware Check"
            echo ""
            printf -- '- Endpoint comparison version: `%s`\n' "${{ steps.current_version.outputs.current_version }}"
            printf -- '- Update available: `%s`\n' "$NEED_UPDATE"
            printf -- '- Available SOC version: `%s`\n' "$VERSION"
            printf -- '- Package filename: `%s`\n' "$PACKAGE_FILENAME"
            printf -- '- Package candidate changed: `%s`\n' "$PACKAGE_CANDIDATE_CHANGED"
            printf -- '- Forced update: `%s`\n' "$IS_FORCE"
            printf -- '- Package size: `%s`\n' "$APK_SIZE"
            echo "- Release notes: $DESCRIPTION"
            echo "- Package URL: $URL"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload sanitized response
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qidi-max4-update-response-sanitized
          path: qidi-max4-update-response.sanitized.json
          if-no-files-found: ignore

  download-package:
    runs-on: ubuntu-latest
    needs: check-firmware
    if: needs.check-firmware.outputs.need_update == 'true' && (needs.check-firmware.outputs.package_candidate_changed == 'true' || (github.event_name == 'workflow_dispatch' && (inputs.download_package == true || inputs.publish_release == true)))
    permissions:
      contents: read
    outputs:
      package_filename: ${{ steps.download.outputs.package_filename }}
      archive_sha256: ${{ steps.download.outputs.archive_sha256 }}
    steps:
      - name: Download package
        id: download
        run: |
          PACKAGE_URL="${{ needs.check-firmware.outputs.url }}"
          # Preserve the vendor filename exactly as published by QIDI.
          PACKAGE_NAME=$(basename "${PACKAGE_URL%%\?*}")
          PACKAGE_DIR="package-artifacts"

          mkdir -p "$PACKAGE_DIR"

          wget -O "$PACKAGE_DIR/$PACKAGE_NAME" "$PACKAGE_URL"
          ARCHIVE_SHA256=$(sha256sum "$PACKAGE_DIR/$PACKAGE_NAME" | tee "$PACKAGE_DIR/$PACKAGE_NAME.sha256" | awk '{print $1}')
          file "$PACKAGE_DIR/$PACKAGE_NAME" | tee "$PACKAGE_DIR/$PACKAGE_NAME.file.txt"

          echo "package_filename=$PACKAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "archive_sha256=$ARCHIVE_SHA256" >> "$GITHUB_OUTPUT"

      - name: Inspect archive contents
        run: |
          PACKAGE_URL="${{ needs.check-firmware.outputs.url }}"
          PACKAGE_NAME=$(basename "${PACKAGE_URL%%\?*}")
          PACKAGE_DIR="package-artifacts"

          unzip -l "$PACKAGE_DIR/$PACKAGE_NAME" | tee "$PACKAGE_DIR/$PACKAGE_NAME.contents.txt"

      - name: Upload package artifacts
        uses: actions/upload-artifact@v7
        with:
          name: qidi-max4-firmware-package
          path: |
            package-artifacts/*

  sync-configs:
    runs-on: ubuntu-latest
    needs:
      - check-firmware
      - download-package
    if: always() && needs.download-package.result == 'success' && (github.event_name == 'schedule' || inputs.publish_release == true)
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      commit_sha: ${{ steps.commit.outputs.commit_sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Download package artifact
        uses: actions/download-artifact@v8
        with:
          name: qidi-max4-firmware-package
          path: sync-assets/package-artifacts

      - name: Sync package-owned firmware files
        run: |
          PACKAGE_ZIP=$(find sync-assets/package-artifacts -maxdepth 1 -type f -name '*.zip' | sort | head -n 1)
          if [ -z "$PACKAGE_ZIP" ]; then
            echo "Firmware zip artifact not found" >&2
            exit 1
          fi

          bash .github/scripts/sync-qidi-max4-configs.sh "$PACKAGE_ZIP" .

      - name: Commit synced package contents
        id: commit
        env:
          FIRMWARE_VERSION: ${{ needs.check-firmware.outputs.version }}
        run: |
          if ! bash .github/scripts/has-qidi-max4-sync-changes.sh; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git add -A -- config klipper/klippy firmware-package.json
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "Update package-owned files for QIDI Max 4 firmware ${FIRMWARE_VERSION}"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  publish-release:
    runs-on: ubuntu-latest
    needs:
      - check-firmware
      - download-package
      - sync-configs
    if: always() && needs.sync-configs.result == 'success' && (github.event_name == 'schedule' || inputs.publish_release == true)
    permissions:
      contents: write
    steps:
      - name: Checkout synced repository state
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.sync-configs.outputs.commit_sha }}

      - name: Download package artifact
        uses: actions/download-artifact@v8
        with:
          name: qidi-max4-firmware-package
          path: release-assets/package-artifacts

      - name: Create GitHub release
        uses: actions/github-script@v8
        env:
          RELEASE_TAG: qidi-max4-firmware-${{ needs.check-firmware.outputs.version }}-${{ needs.download-package.outputs.archive_sha256 }}
          RELEASE_NAME: QIDI Max 4 Firmware ${{ needs.check-firmware.outputs.version }}
          ENDPOINT_COMPARISON_VERSION: ${{ needs.check-firmware.outputs.current_version }}
          AVAILABLE_VERSION: ${{ needs.check-firmware.outputs.version }}
          ARCHIVE_SHA256: ${{ needs.download-package.outputs.archive_sha256 }}
          IS_FORCE: ${{ needs.check-firmware.outputs.is_force }}
          APK_SIZE: ${{ needs.check-firmware.outputs.apk_size }}
          DESCRIPTION_URL: ${{ needs.check-firmware.outputs.description }}
          PACKAGE_URL: ${{ needs.check-firmware.outputs.url }}
          PACKAGE_SYNC_CHANGED: ${{ needs.sync-configs.outputs.changed }}
          TARGET_COMMITISH: ${{ needs.sync-configs.outputs.commit_sha }}
          ASSET_DIR: release-assets/package-artifacts
          PACKAGE_IDENTITY_FILE: firmware-package.json
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const assetDir = process.env.ASSET_DIR;
            const identity = JSON.parse(fs.readFileSync(process.env.PACKAGE_IDENTITY_FILE, 'utf8'));

            if (identity.firmware_archive.sha256 !== process.env.ARCHIVE_SHA256) {
              core.setFailed('Checked-in package identity does not match the downloaded archive');
              return;
            }

            try {
              await github.rest.repos.getReleaseByTag({
                owner,
                repo,
                tag: process.env.RELEASE_TAG,
              });
              core.notice(`Release ${process.env.RELEASE_TAG} already exists`);
              return;
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
            }

            const assetFiles = fs.readdirSync(assetDir)
              .map((name) => path.join(assetDir, name))
              .filter((filePath) => fs.statSync(filePath).isFile())
              .sort((a, b) => path.basename(a).localeCompare(path.basename(b)));

            if (assetFiles.length === 0) {
              core.setFailed(`No release assets found in ${assetDir}`);
              return;
            }

            const zipAssets = assetFiles.filter((filePath) => filePath.toLowerCase().endsWith('.zip'));
            if (zipAssets.length === 0) {
              core.setFailed(`No firmware zip asset found in ${assetDir}`);
              return;
            }

            const packageFilename = path.basename(zipAssets[0]);

            const releaseBody = [
              '## Package Metadata',
              `- Endpoint comparison version: \`${process.env.ENDPOINT_COMPARISON_VERSION}\``,
              `- Available SOC version: \`${process.env.AVAILABLE_VERSION}\``,
              `- Firmware archive: \`${identity.firmware_archive.filename}\``,
              `- Firmware archive SHA-256: \`${identity.firmware_archive.sha256}\``,
              `- SOC payload: \`${identity.soc_payload.filename}\``,
              `- SOC payload SHA-256: \`${identity.soc_payload.sha256}\``,
              `- Forced update: \`${process.env.IS_FORCE}\``,
              `- Package size: \`${process.env.APK_SIZE}\``,
              `- Repo package sync changed files: \`${process.env.PACKAGE_SYNC_CHANGED || 'false'}\``,
              `- Release commit: \`${process.env.TARGET_COMMITISH || context.sha}\``,
              `- Release notes URL: ${process.env.DESCRIPTION_URL}`,
              `- Original QIDI package URL: ${process.env.PACKAGE_URL}`,
              '',
              '## Offline Update Instructions',
              '1. Create a new folder on your USB drive and name it `QD_Update`.',
              `2. Download the attached firmware package asset \`${packageFilename}\` from this release.`,
              '3. Drag the compressed file directly into the `QD_Update` folder without extracting it.',
              '4. Insert the USB drive into your machine and perform the offline update.',
              '',
              'Source: QIDI Max 4 firmware metadata endpoint',
            ].join('\n');

            const { data: release } = await github.rest.repos.createRelease({
              owner,
              repo,
              tag_name: process.env.RELEASE_TAG,
              target_commitish: process.env.TARGET_COMMITISH || context.sha,
              name: `${process.env.RELEASE_NAME} (${process.env.ARCHIVE_SHA256.slice(0, 12)})`,
              body: releaseBody,
              draft: false,
              prerelease: false,
              generate_release_notes: false,
            });

            for (const filePath of assetFiles) {
              const data = fs.readFileSync(filePath);

              await github.rest.repos.uploadReleaseAsset({
                owner,
                repo,
                release_id: release.id,
                name: path.basename(filePath),
                data,
                headers: {
                  'content-type': 'application/octet-stream',
                  'content-length': data.length,
                },
              });
            }
